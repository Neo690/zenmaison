# Déploiement de ZenMaison sur Cloudflare Pages à chaque push sur main.
# Prérequis : secrets de repo CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID
# (token API avec le scope "Cloudflare Pages: Edit" uniquement).
# Test manuel : onglet Actions → "Deploy ZenMaison to Cloudflare Pages" → Run workflow.
name: Deploy ZenMaison to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@latest pages deploy . --project-name zenmaison --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
